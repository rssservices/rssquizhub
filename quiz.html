<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Forms</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1a202c}
    .container{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:40px;max-width:680px;width:100%;margin:20px}
    .screen{display:none}.screen.active{display:block}
    h1{font-size:1.8rem;font-weight:700;margin-bottom:8px}
    h2{font-size:1.3rem;font-weight:600;color:#2d3748;margin-bottom:16px}
    p{color:#4a5568;line-height:1.6}
    .logo{width:52px;height:52px;background:#4f46e5;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .logo svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .field{margin-bottom:18px}
    .field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:#2d3748}
    .field input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:15px;font-family:inherit;transition:border-color .15s}
    .field input:focus{outline:none;border-color:#4f46e5}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
    .btn-primary{background:#4f46e5;color:#fff;width:100%;justify-content:center;margin-top:8px}
    .btn-primary:hover{background:#4338ca}
    .btn-primary:disabled{background:#a5b4fc;cursor:not-allowed}
    .btn-back{background:none;color:#718096;border:1.5px solid #e2e8f0}
    .btn-back:hover{border-color:#a0aec0;color:#4a5568}
    .progress-label{font-size:13px;color:#718096;margin-bottom:8px}
    .progress-bar{height:6px;background:#e2e8f0;border-radius:3px;margin-bottom:28px;overflow:hidden}
    .progress-fill{height:100%;background:#4f46e5;border-radius:3px;transition:width .3s}
    .question-text{font-size:17px;font-weight:600;margin-bottom:20px;line-height:1.5}
    .options-list{list-style:none;display:flex;flex-direction:column;gap:10px}
    .option-item label{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:all .15s;font-size:15px;line-height:1.4}
    .option-item input[type=radio]{margin-top:2px;accent-color:#4f46e5;flex-shrink:0}
    .option-item label:hover{border-color:#4f46e5;background:#f5f3ff}
    .option-item:has(input:checked) label{border-color:#4f46e5;background:#f5f3ff}
    .text-input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:15px;font-family:inherit;resize:vertical;min-height:90px;transition:border-color .15s}
    .text-input:focus{outline:none;border-color:#4f46e5}
    select.text-input{min-height:0;cursor:pointer;background:#fff}
    img.q-image{display:block;max-width:100%;max-height:340px;border-radius:8px;
      border:1px solid #e2e8f0;margin:14px 0}
    .section-banner img.q-image{max-height:220px;margin:10px 0 2px}
    /* Rating scale — the numbers wrap on narrow screens rather than overflow */
    .rating-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
    .rating-item{flex:1 1 56px}
    .rating-item input{position:absolute;opacity:0;width:0;height:0}
    .rating-item span{display:flex;align-items:center;justify-content:center;min-height:48px;
      border:1.5px solid #e2e8f0;border-radius:8px;font-size:16px;font-weight:600;
      color:#4a5568;cursor:pointer;transition:all .15s;background:#fff}
    .rating-item span:hover{border-color:#a5b4fc;background:#f5f3ff}
    .rating-item input:checked + span{background:#4f46e5;border-color:#4f46e5;color:#fff}
    .rating-item input:focus-visible + span{outline:2px solid #4f46e5;outline-offset:2px}
    .rating-labels{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
      font-size:12.5px;color:#718096}
    .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
    .score-circle{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;color:#fff}
    .score-number{font-size:38px;font-weight:800;line-height:1}
    .score-label{font-size:12px;opacity:.85;margin-top:4px}
    .result-header{text-align:center;margin-bottom:28px}
    .result-header h2{margin-bottom:6px}
    .review-section{margin-top:20px}
    .review-section h3{font-size:14px;color:#718096;margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .answer-item{padding:12px 14px;border-radius:8px;margin-bottom:8px;font-size:14px}
    .answer-correct{background:#f0fff4;border:1.5px solid #9ae6b4}
    .answer-wrong{background:#fff5f5;border:1.5px solid #feb2b2}
    .answer-open{background:#fffbeb;border:1.5px solid #fbd38d}
    .answer-q{font-weight:600;color:#2d3748;margin-bottom:4px}
    .answer-given{color:#4a5568;font-size:13px}
    .answer-verdict{font-size:12px;margin-top:3px;font-weight:600}
    .answer-correct .answer-verdict{color:#276749}
    .answer-wrong .answer-verdict{color:#c53030}
    .answer-open .answer-verdict{color:#744210}
    .loading{text-align:center;padding:48px 20px;color:#718096}
    .spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-box{background:#fff5f5;border:1.5px solid #feb2b2;border-radius:8px;padding:12px 14px;color:#c53030;font-size:14px;margin-top:14px;display:none}
    .info-note{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:8px;padding:12px 14px;color:#1e40af;font-size:13px;margin-top:14px}
    .subtitle{font-size:14px;color:#718096;margin-top:6px}
    .quiz-title{font-size:1.1rem;font-weight:700;color:#4f46e5;margin-bottom:20px;padding-bottom:14px;border-bottom:1.5px solid #e2e8f0}
    .instructions-box{background:#f5f3ff;border:1.5px solid #ddd6fe;border-radius:8px;padding:14px 16px;margin-top:18px;font-size:14px;color:#3730a3;line-height:1.6;white-space:pre-wrap}
    .instructions-box strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6d28d9;margin-bottom:6px;white-space:normal}
    .section-banner{background:#f5f3ff;border-left:4px solid #4f46e5;border-radius:6px;padding:12px 14px;margin-bottom:20px}
    .section-banner-title{font-weight:700;font-size:14px;color:#4f46e5}
    .section-banner-text{font-size:13px;color:#4a5568;line-height:1.55;margin-top:4px;white-space:pre-wrap}
    .review-section-title{font-size:13px;font-weight:700;color:#4f46e5;margin:18px 0 8px}
  </style>
</head>
<body>
<div class="container">

  <!-- INFO SCREEN -->
  <div id="screen-info" class="screen active">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </div>
    <h1>RSS Forms</h1>
    <p class="subtitle" id="quiz-subtitle">Loading quiz...</p>
    <div class="instructions-box" id="quiz-instructions" style="display:none"></div>
    <p style="margin-top:16px">Please enter your details below to begin.</p>
    <div style="margin-top:24px">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="taker-name" placeholder="e.g. Juan Dela Cruz" autocomplete="name">
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="taker-email" placeholder="e.g. juan@example.com" autocomplete="email">
      </div>
    </div>
    <button class="btn btn-primary" id="btn-start" onclick="startQuiz()">Begin Quiz →</button>
    <div id="info-error" class="error-box"></div>
  </div>

  <!-- LOADING -->
  <div id="screen-loading" class="screen">
    <div class="loading">
      <div class="spinner"></div>
      <p id="loading-msg">Loading quiz...</p>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-title" id="quiz-title-bar"></div>
    <div class="progress-label" id="progress-label"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="question-card"></div>
    <div class="nav-buttons">
      <button class="btn btn-back" id="btn-back" onclick="prevQuestion()">← Back</button>
      <button class="btn btn-primary" id="btn-next" style="width:auto" onclick="nextOrSubmit()">Next →</button>
    </div>
    <div id="quiz-error" class="error-box"></div>
  </div>

  <!-- RESULTS -->
  <div id="screen-results" class="screen">
    <div class="result-header">
      <div class="score-circle">
        <div class="score-number" id="score-number">–</div>
        <div class="score-label" id="score-label">Score</div>
      </div>
      <h2 id="result-msg"></h2>
      <p>A confirmation has been sent to your email.</p>
    </div>
    <div class="review-section">
      <h3>Your Answers</h3>
      <div id="answers-list"></div>
    </div>
  </div>

</div>

<script>
// ── CONFIG — paste your Apps Script Web App URL here ──────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbya2DbPdqL4MDXvbAB2k6lDlV9yev3r8mtWtZNxv528F_C3OyxAtT51ADiyytYYTkiWDQ/exec';
// ─────────────────────────────────────────────────────────────

let quizId, quizData, answers, currentIndex;
let takerName, takerEmail;
// The path actually taken through the form, as question indexes. Drives the
// Back button and tells the backend which questions this taker was shown.
let visited = [];

// ── INIT ──────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  quizId = params.get('id');

  if (!quizId) {
    document.getElementById('quiz-subtitle').textContent = 'No quiz specified.';
    showError('info-error', 'No quiz ID found in the URL. Please use a valid quiz link.');
    document.getElementById('btn-start').disabled = true;
    return;
  }

  if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    showError('info-error', 'Quiz is not configured yet. Please contact your administrator.');
    document.getElementById('btn-start').disabled = true;
    return;
  }

  try {
    setLoading('Fetching quiz...');
    showScreen('screen-loading');
    const res = await fetch(`${SCRIPT_URL}?action=getQuiz&id=${encodeURIComponent(quizId)}`);
    quizData = await res.json();
    if (quizData.error) throw new Error(quizData.error);

    document.getElementById('quiz-subtitle').textContent = quizData.name;
    if (quizData.instructions && quizData.instructions.trim()) {
      const box = document.getElementById('quiz-instructions');
      box.innerHTML = `<strong>Instructions</strong>${esc(quizData.instructions.trim())}`;
      box.style.display = '';
    }
    showScreen('screen-info');
  } catch (e) {
    showScreen('screen-info');
    document.getElementById('quiz-subtitle').textContent = 'Error loading quiz';
    showError('info-error', e.message || 'Failed to load quiz. Please try again.');
    document.getElementById('btn-start').disabled = true;
  }
});

// ── START ─────────────────────────────────────────────────────
function startQuiz() {
  takerName  = document.getElementById('taker-name').value.trim();
  takerEmail = document.getElementById('taker-email').value.trim();

  if (!takerName) { showError('info-error', 'Please enter your full name.'); return; }
  if (!takerEmail || !takerEmail.includes('@')) {
    showError('info-error', 'Please enter a valid email address.'); return;
  }

  answers      = new Array(quizData.questions.length).fill(null);
  // The first question may itself be behind a condition.
  currentIndex = nextVisibleFrom(0);
  if (currentIndex === -1) {
    showError('info-error', 'This form has no questions to show.');
    return;
  }
  visited      = [currentIndex];
  document.getElementById('quiz-title-bar').textContent = quizData.name;
  showScreen('screen-quiz');
  renderQuestion();
}

// ── RENDER QUESTION ───────────────────────────────────────────
function renderQuestion() {
  const q     = quizData.questions[currentIndex];
  const total = quizData.questions.length;
  const saved = answers[currentIndex];

  // With branching the remaining question count isn't known ahead of time,
  // so don't claim a total that may not hold. The bar still tracks position
  // in the form as a rough indicator.
  const branching = quizData.questions.some(x =>
    (x.condition && x.condition.qid) ||
    (Array.isArray(x.jump) && x.jump.length) ||
    (x.section && x.section.condition && x.section.condition.qid));
  document.getElementById('progress-label').textContent = branching
    ? `Question ${visited.length}`
    : `Question ${currentIndex + 1} of ${total}`;
  document.getElementById('progress-fill').style.width = ((currentIndex / total) * 100) + '%';

  const type = (q.type || '').toLowerCase();
  let html = '';
  if (q.section) {
    html += `<div class="section-banner">
      <div class="section-banner-title">${esc(q.section.title)}</div>
      ${q.section.instructions && q.section.instructions.trim()
        ? `<div class="section-banner-text">${esc(q.section.instructions.trim())}</div>` : ''}
      ${q.section.imageUrl ? imageHtml(q.section.imageUrl, 'Section image') : ''}
    </div>`;
  }
  html += `<div class="question-text">${esc(q.question)}${
    q.required === false ? ' <span style="font-weight:400;opacity:.6;font-size:.85em">(optional)</span>' : ''
  }</div>`;

  if (q.imageUrl) html += imageHtml(q.imageUrl, 'Question image');

  if (type === 'checkboxes' || type.includes('checkbox')) {
    // Multi-select. Stored as a comma-joined string so it reads cleanly in
    // the sheet; the backend compares it as an order-insensitive set.
    const chosen = splitMulti(saved);
    html += `<ul class="options-list">`;
    (q.options || []).forEach(opt => {
      const chk = chosen.indexOf(opt) !== -1 ? 'checked' : '';
      html += `<li class="option-item"><label>
        <input type="checkbox" value="${esc(opt)}" ${chk} onchange="saveCheckbox(this)">
        <span>${esc(opt)}</span>
      </label></li>`;
    });
    html += `</ul>`;
  } else if (type === 'dropdown' || type.includes('dropdown')) {
    html += `<select class="text-input" onchange="saveAnswer(this.value)">
      <option value="">— select an answer —</option>` +
      (q.options || []).map(opt =>
        `<option value="${esc(opt)}" ${saved === opt ? 'selected' : ''}>${esc(opt)}</option>`
      ).join('') + `</select>`;
  } else if (type === 'rating' || type.includes('rating') || type.includes('scale')) {
    const cfg = q.config || {};
    const min = Number.isFinite(+cfg.min) ? +cfg.min : 1;
    const max = Number.isFinite(+cfg.max) ? +cfg.max : 5;
    html += `<div class="rating-row">`;
    for (let n = min; n <= max && n - min < 50; n++) {
      html += `<label class="rating-item">
        <input type="radio" name="q" value="${n}" ${String(saved) === String(n) ? 'checked' : ''} onchange="saveAnswer(this.value)">
        <span>${n}</span>
      </label>`;
    }
    html += `</div>`;
    if ((cfg.minLabel || '').trim() || (cfg.maxLabel || '').trim()) {
      html += `<div class="rating-labels">
        <span>${esc(cfg.minLabel || '')}</span><span>${esc(cfg.maxLabel || '')}</span>
      </div>`;
    }
  } else if (type.includes('multiple') || type.includes('mc') || type.includes('choice')) {
    html += `<ul class="options-list">`;
    (q.options || []).forEach(opt => {
      const chk = saved === opt ? 'checked' : '';
      html += `<li class="option-item"><label>
        <input type="radio" name="q" value="${esc(opt)}" ${chk} onchange="saveAnswer(this.value)">
        <span>${esc(opt)}</span>
      </label></li>`;
    });
    html += `</ul>`;
  } else if (type.includes('true') || type.includes('false') || type === 'tf') {
    html += `<ul class="options-list">`;
    ['True', 'False'].forEach(opt => {
      const chk = saved === opt ? 'checked' : '';
      html += `<li class="option-item"><label>
        <input type="radio" name="q" value="${opt}" ${chk} onchange="saveAnswer(this.value)">
        <span>${opt}</span>
      </label></li>`;
    });
    html += `</ul>`;
  } else {
    // Short Text and Long Text — same control, different height.
    const rows = type.includes('long') || type.includes('paragraph') ? 7 : 3;
    html += `<textarea class="text-input" rows="${rows}" placeholder="Type your answer here..." oninput="saveAnswer(this.value)">${esc(saved || '')}</textarea>`;
  }

  document.getElementById('question-card').innerHTML = html;
  // "Last question" is whether anything visible follows, not whether this is
  // the last row in the list — a jump can end the form early.
  const isLast = nextVisibleFrom(currentIndex + 1) === -1;
  document.getElementById('btn-next').textContent   = isLast ? 'Submit ✓' : 'Next →';
  document.getElementById('btn-back').style.visibility = visited.length < 2 ? 'hidden' : 'visible';
  document.getElementById('quiz-error').style.display  = 'none';
}

// The backend already converted Drive links, so this just renders. A broken
// image hides itself rather than leaving a torn icon mid-question.
function imageHtml(url, alt) {
  return `<img class="q-image" src="${esc(url)}" alt="${esc(alt)}" loading="lazy"
            onerror="this.style.display='none'">`;
}

function saveAnswer(val) { answers[currentIndex] = val; }

// Checkbox answers hold several values in one cell, joined with a pipe
// rather than a comma — option text often contains commas, and a
// comma-joined value can't be split back apart reliably. Reading accepts
// both, so responses recorded before this change still parse.
const MULTI_SEP = ' | ';

function splitMulti(raw) {
  const s = String(raw == null ? '' : raw);
  const parts = s.indexOf('|') !== -1 ? s.split('|') : s.split(',');
  return parts.map(x => x.trim()).filter(Boolean);
}

// Collects every ticked box in the current question, keeping the order the
// options were shown in.
function saveCheckbox() {
  const boxes = document.querySelectorAll('#question-card input[type="checkbox"]');
  const picked = Array.from(boxes).filter(b => b.checked).map(b => b.value);
  answers[currentIndex] = picked.join(MULTI_SEP);
}

// ── CONDITIONAL LOGIC ─────────────────────────────────────────
// Answers are held by position; conditions reference questions by id.
function answerFor(qid) {
  const i = quizData.questions.findIndex(q => (q.qid || '') === qid);
  return i === -1 ? '' : (answers[i] == null ? '' : String(answers[i]));
}

// A condition is {qid, op, value}. Anything malformed or referencing an
// unknown question is treated as "no condition" — a broken rule must not
// silently hide a question.
function conditionMet(cond) {
  if (!cond || !cond.qid || !cond.op) return true;
  const given = answerFor(cond.qid).trim().toLowerCase();
  const want  = String(cond.value == null ? '' : cond.value).trim().toLowerCase();
  const list  = want.split(',').map(s => s.trim()).filter(Boolean);
  // Checkbox answers arrive comma-joined.
  const parts = given.split(',').map(s => s.trim()).filter(Boolean);

  switch (cond.op) {
    case 'is':       return given === want;
    case 'is_not':   return given !== want;
    case 'includes': return parts.indexOf(want) !== -1;
    case 'any_of':   return list.some(v => given === v || parts.indexOf(v) !== -1);
    default:         return true;
  }
}

// A question shows only if its own rule passes and its section's rule does.
function isVisible(i) {
  const q = quizData.questions[i];
  if (!q) return false;
  if (q.section && !conditionMet(q.section.condition)) return false;
  return conditionMet(q.condition);
}

// First question of a section, by section id.
function sectionStart(sectionQid) {
  return quizData.questions.findIndex(q => q.section && q.section.qid === sectionQid);
}

// Jump rules are [{value, to}]; `to` is a section id or 'END'. '*' matches
// any answer and acts as the fallback.
function jumpTarget(q, answer) {
  const rules = Array.isArray(q.jump) ? q.jump : null;
  if (!rules || !rules.length) return null;
  const given = String(answer == null ? '' : answer).trim().toLowerCase();
  let wildcard = null;
  for (const r of rules) {
    if (!r || !r.to) continue;
    const v = String(r.value == null ? '' : r.value).trim().toLowerCase();
    if (v === '*') { wildcard = r.to; continue; }
    if (v === given) return r.to;
  }
  return wildcard;
}

// Walks forward from `from` to the next question the taker should see.
// Returns -1 when the form is finished.
function nextVisibleFrom(from) {
  for (let i = from; i < quizData.questions.length; i++) {
    if (isVisible(i)) return i;
  }
  return -1;
}

function nextOrSubmit() {
  const q   = quizData.questions[currentIndex];
  const ans = answers[currentIndex];
  const isBlank = ans == null || String(ans).trim() === '';
  // Questions are required unless the admin marked them optional.
  if (q.required !== false && isBlank) {
    showError('quiz-error', 'Please answer this question before continuing.');
    return;
  }

  // A matching jump rule overrides simply moving to the next question.
  let target = -1;
  const jump = jumpTarget(q, ans);
  if (jump === 'END') {
    submitQuiz(); return;
  } else if (jump) {
    const start = sectionStart(jump);
    target = start === -1 ? currentIndex + 1 : start;
  } else {
    target = currentIndex + 1;
  }

  const next = nextVisibleFrom(target);
  if (next === -1) { submitQuiz(); return; }

  visited.push(next);
  currentIndex = next;
  renderQuestion();
}

// Back retraces the path actually taken, which with branching is not
// simply the previous index.
function prevQuestion() {
  if (visited.length < 2) return;
  visited.pop();
  currentIndex = visited[visited.length - 1];
  renderQuestion();
}

// ── SUBMIT ────────────────────────────────────────────────────
async function submitQuiz() {
  setLoading('Submitting your answers...');
  showScreen('screen-loading');

  try {
    // POSTed as text/plain so the browser skips the CORS preflight that
    // Apps Script web apps don't answer. Answers are keyed by question id,
    // and `seen` records what this taker was actually shown, so the backend
    // can store and score without relying on column position.
    const answersByQid = {};
    quizData.questions.forEach((q, i) => {
      const qid = q.qid || ('p' + (i + 1));
      answersByQid[qid] = answers[i] == null ? '' : answers[i];
    });
    // Only the questions this taker actually saw. Branching means that is
    // not the whole list — the backend marks the rest as skipped and leaves
    // them out of the score.
    const seen = visited.map(i => {
      const q = quizData.questions[i];
      return (q && q.qid) || ('p' + (i + 1));
    }).filter((v, i, a) => a.indexOf(v) === i);

    const res = await fetch(SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action:  'submit',
        quizId:  quizId,
        name:    takerName,
        email:   takerEmail,
        answers: answersByQid,
        seen:    seen
      })
    });
    const result = await res.json();

    if (result.error) throw new Error(result.error);
    showResults(result);
  } catch (e) {
    // If submission failed, still show a results screen
    showResults({ error: e.message });
  }
}

// ── RESULTS ───────────────────────────────────────────────────
function showResults(result) {
  if (result.error) {
    document.getElementById('score-number').textContent = '!';
    document.getElementById('score-label').textContent  = 'Error';
    document.getElementById('result-msg').textContent   = 'Submission issue';
    document.getElementById('answers-list').innerHTML   =
      `<div class="answer-item answer-wrong"><div class="answer-q">Could not save your responses: ${esc(result.error)}</div></div>`;
    showScreen('screen-results');
    return;
  }

  const { pct, scoreStr, results, total } = result;
  const isSurvey = !!(result.isSurvey || quizData.isSurvey);

  if (isSurvey) {
    // Surveys aren't scored — no number, no right/wrong, just a receipt.
    document.getElementById('score-number').textContent = '✓';
    document.getElementById('score-label').textContent  = 'Response recorded';
    document.getElementById('result-msg').textContent   = '🙏 Thanks for your response!';
  } else {
    document.getElementById('score-number').textContent = pct !== null ? pct + '%' : '✓';
    document.getElementById('score-label').textContent  = total > 0 ? scoreStr : 'Submitted';
    document.getElementById('result-msg').textContent   =
      pct === null ? '✅ Quiz Complete!' :
      pct >= 80    ? '🎉 Excellent work!' :
      pct >= 60    ? '👍 Good effort!'   : '📚 Keep studying!';
  }

  let html = '';
  let lastSection = null;
  const wasSeen = new Set(visited);
  quizData.questions.forEach((q, i) => {
    // Don't review questions this taker was never shown.
    if (!wasSeen.has(i)) return;
    const userAns  = answers[i] == null || String(answers[i]).trim() === ''
                     ? '(no answer)' : answers[i];
    const isCorrect = isSurvey ? null : (results ? results[i] : null);

    const secTitle = q.section ? q.section.title : null;
    if (secTitle && secTitle !== lastSection) {
      html += `<div class="review-section-title">${esc(secTitle)}</div>`;
    }
    lastSection = secTitle;

    if (isCorrect === null) {
      html += `<div class="answer-item answer-open">
        <div class="answer-q">Q${i+1}: ${esc(q.question)}</div>
        <div class="answer-given">Your answer: ${esc(userAns)}</div>
        <div class="answer-verdict">${isSurvey ? 'Recorded' : 'Open-ended — not auto-graded'}</div>
      </div>`;
    } else if (isCorrect) {
      html += `<div class="answer-item answer-correct">
        <div class="answer-q">Q${i+1}: ${esc(q.question)}</div>
        <div class="answer-given">Your answer: ${esc(userAns)}</div>
        <div class="answer-verdict">✓ Correct</div>
      </div>`;
    } else {
      html += `<div class="answer-item answer-wrong">
        <div class="answer-q">Q${i+1}: ${esc(q.question)}</div>
        <div class="answer-given">Your answer: ${esc(userAns)}</div>
        <div class="answer-verdict">✗ Incorrect</div>
      </div>`;
    }
  });

  document.getElementById('answers-list').innerHTML = html;
  showScreen('screen-results');
}

// ── HELPERS ───────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent  = msg;
  el.style.display = 'block';
}
function setLoading(msg) {
  document.getElementById('loading-msg').textContent = msg || 'Loading...';
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
